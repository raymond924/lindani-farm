# Render Blueprint for the Lindani Farm website (generated by tools/static_host_files.py).
# In Render: New > Blueprint > connect this repository. Free static site, publishes public/.
services:
  - type: web
    name: lindani-farm
    runtime: static
    buildCommand: echo "Static site, nothing to build"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: "/admin"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
      - path: "/admin"
        name: "Cache-Control"
        value: "no-store"
      - path: "/admin.html"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
      - path: "/admin.html"
        name: "Cache-Control"
        value: "no-store"
      - path: "/assets/*"
        name: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - path: "/assets/*"
        name: "Access-Control-Allow-Origin"
        value: "*"
      - path: "/*.js"
        name: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
      - path: "/*.css"
        name: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
      - path: "/*"
        name: "X-Content-Type-Options"
        value: "nosniff"
      - path: "/*"
        name: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: "X-Frame-Options"
        value: "SAMEORIGIN"
      - path: "/*"
        name: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=()"
    routes:
      - type: redirect
        source: "/home"
        destination: "/"
      - type: redirect
        source: "/index.php"
        destination: "/"
      - type: redirect
        source: "/about"
        destination: "/farm"
      - type: redirect
        source: "/about-us"
        destination: "/farm"
      - type: redirect
        source: "/the-farm"
        destination: "/farm"
      - type: redirect
        source: "/gallery"
        destination: "/farm"
      - type: redirect
        source: "/accommodation"
        destination: "/studios"
      - type: redirect
        source: "/rooms"
        destination: "/studios"
      - type: redirect
        source: "/units"
        destination: "/studios"
      - type: redirect
        source: "/cottages"
        destination: "/studios"
      - type: redirect
        source: "/rates"
        destination: "/studios"
      - type: redirect
        source: "/booking"
        destination: "/book"
      - type: redirect
        source: "/bookings"
        destination: "/book"
      - type: redirect
        source: "/book-now"
        destination: "/book"
      - type: redirect
        source: "/reservations"
        destination: "/book"
      - type: redirect
        source: "/contact-us"
        destination: "/contact"
      - type: redirect
        source: "/things-to-do"
        destination: "/explore"
      - type: redirect
        source: "/activities"
        destination: "/explore"
      - type: redirect
        source: "/booking-policy"
        destination: "/policy"
      - type: redirect
        source: "/privacy-policy"
        destination: "/privacy"
      - type: redirect
        source: "/terms-and-conditions"
        destination: "/terms"
      - type: redirect
        source: "/paia-manual"
        destination: "/paia"
      - type: rewrite
        source: "/admin"
        destination: "/admin.html"
      - type: rewrite
        source: "/book"
        destination: "/book.html"
      - type: rewrite
        source: "/contact"
        destination: "/contact.html"
      - type: rewrite
        source: "/explore"
        destination: "/explore.html"
      - type: rewrite
        source: "/farm"
        destination: "/farm.html"
      - type: rewrite
        source: "/paia"
        destination: "/paia.html"
      - type: rewrite
        source: "/policy"
        destination: "/policy.html"
      - type: rewrite
        source: "/privacy"
        destination: "/privacy.html"
      - type: rewrite
        source: "/studios"
        destination: "/studios.html"
      - type: rewrite
        source: "/terms"
        destination: "/terms.html"
      - type: rewrite
        source: "/*"
        destination: "/404.html"
